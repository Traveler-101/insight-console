<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f6bff'/><path d='M9 21V12M16 21V8M23 21v-6' stroke='white' stroke-width='3' stroke-linecap='round'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Insight Console - 运营数据中台" />
    <title>Insight Console · 运营数据中台</title>
    <script>
      // 首屏前同步恢复主题，避免深色用户看到白屏闪烁（FOUC）
      try {
        var raw = localStorage.getItem('insight.ui');
        var theme = raw ? JSON.parse(raw).state.theme : 'light';
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
